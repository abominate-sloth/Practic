<div class="container">
  <form (ngSubmit)="saveRole()">
    <h1>{{ role.id ? 'Редактировать роль' : 'Добавить роль' }}</h1>

    <label>
      Название роли:
      <input [(ngModel)]="role.roleName" name="roleName" required>
    </label>

    <button type="submit">Сохранить</button>
    <a [routerLink]="['/roles']">Назад к списку ролей</a>
  </form>
</div>
