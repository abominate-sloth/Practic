<h1>Список авторов</h1>
<button [routerLink]="['/authors/new']">Добавить автора</button>
<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Имя</th>
    <th>Дата рождения</th>
    <th>Действия</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let author of authors">
    <td>{{ author.id }}</td>
    <td>{{ author.name }}</td>
    <td>{{ author.birthDate | date:'dd.MM.yyyy' }}</td>
    <td>
      <button [routerLink]="['/authors', author.id, 'edit']">Редактировать</button>
      <button (click)="deleteAuthor(author.id)">Удалить</button>
    </td>
  </tr>
  </tbody>
</table>
<a routerLink="/">Назад к списку таблиц</a>
