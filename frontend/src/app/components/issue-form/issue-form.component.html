<div class="form-container">
  <h1>{{ issueId ? 'Редактировать выдачу' : 'Добавить выдачу' }}</h1>

  <form (ngSubmit)="saveIssue()">
    <!-- Книга -->
    <div class="form-group">
      <label>Книга:</label>
      <select [(ngModel)]="issueData.bookId" name="bookId" required>
        <option *ngFor="let book of books" [value]="book.id">
          {{ book.title }} (ID: {{ book.id }})
        </option>
      </select>
    </div>

    <!-- Читатель -->
    <div class="form-group">
      <label>Читатель:</label>
      <select [(ngModel)]="issueData.readerId" name="readerId" required>
        <option *ngFor="let reader of readerUsers" [value]="reader.id">
          {{ reader.username }} (ID: {{ reader.id }})
        </option>
      </select>
      <div *ngIf="readerUsers.length === 0" class="no-users">
        Нет доступных читателей
      </div>
    </div>

    <!-- Сотрудник -->
    <div class="form-group">
      <label>Сотрудник:</label>
      <select [(ngModel)]="issueData.employeeId" name="employeeId" required>
        <option *ngFor="let employee of employeeUsers" [value]="employee.id">
          {{ employee.username }} (ID: {{ employee.id }})
        </option>
      </select>
      <div *ngIf="employeeUsers.length === 0" class="no-users">
        Нет доступных сотрудников
      </div>
    </div>

    <!-- Дата выдачи -->
    <div class="form-group">
      <label>Дата выдачи:</label>
      <input type="date"
             [(ngModel)]="issueData.issueDate"
             name="issueDate">
    </div>

    <!-- Дата возврата -->
    <div class="form-group">
      <label>Дата возврата (необязательно):</label>
      <input type="date"
             [(ngModel)]="issueData.returnDate"
             name="returnDate"
             [min]="issueData.issueDate">
      <small *ngIf="issueData.returnDate">Книга будет помечена как возвращенная</small>
    </div>

    <!-- Статус -->
    <div class="form-group">
      <label>Статус:</label>
      <div class="status-indicator">
        <span [class.returned]="issueData.returnDate" [class.not-returned]="!issueData.returnDate">
          {{ issueData.returnDate ? 'Возвращена' : 'На руках' }}
        </span>
      </div>
    </div>

    <!-- Кнопки -->
    <div class="form-actions">
      <button type="submit" class="btn-save">
        {{ issueId ? 'Обновить выдачу' : 'Создать выдачу' }}
      </button>
      <a routerLink="/issues" class="btn-cancel">Отмена</a>
    </div>
  </form>
</div>
