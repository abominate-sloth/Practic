<h1>{{ book.id ? 'Редактировать книгу' : 'Добавить книгу' }}</h1>
<form (ngSubmit)="saveBook()">
  <label>
    Название:
    <input [(ngModel)]="book.title" name="title" required />
  </label>
  <label>
    ISBN:
    <input [(ngModel)]="book.isbn" name="isbn" required />
  </label>
  <label>
    Год издания:
    <input [(ngModel)]="book.publishYear" name="publishYear" type="number" required />
  </label>
  <label>
    Доступно копий:
    <input [(ngModel)]="book.copiesAvailable" name="copiesAvailable" type="number" required />
  </label>
  <label>
    Жанр:
    <select [(ngModel)]="book.genreId" name="genreId" required>
      <option *ngFor="let genre of genres" [value]="genre.id">{{ genre.name }}</option>
    </select>
  </label>
  <button type="submit">Сохранить</button>
</form>
<a [routerLink]="['/books']">Назад к списку книг</a>
