name: SonarCloud React Analysis
on:
  push:
    branches: [front_react]
  pull_request:
    branches: [front_react]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (forced)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install latest SonarScanner with Java 17
        run: |
          # Удаляем все старые версии Java
          sudo rm -rf /usr/lib/jvm/*
          sudo update-java-alternatives --auto

          # Устанавливаем новейший SonarScanner
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner-cli-*.zip
          sudo mv sonar-scanner-*/ /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

          # Принудительно настраиваем Java 17
          echo "export JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "export PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

      - name: Verify environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Java Home ==="
          echo $JAVA_HOME
          echo "=== SonarScanner Version ==="
          sonar-scanner -v

      - name: Run SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.java.version=17 \
            -Dsonar.projectBaseDir=. \
            -Dsonar.organization=adeptsofsloth \
            -Dsonar.projectKey=abominate-sloth_Practic_React \
            -Dsonar.host.url=https://sonarcloud.io \
            -X  # Включение подробного лога