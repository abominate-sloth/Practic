name: SonarCloud React Analysis
on:
  push:
    branches: [front_react]
  pull_request:
    branches: [front_react]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Latest SonarScanner (без встроенной JRE)
        run: |
          # Удаляем старые версии если есть
          sudo rm -rf /opt/sonar-scanner*

          # Скачиваем и устанавливаем новейшую версию (проверьте актуальную версию на сайте)
          SCANNER_VERSION="5.0.1.3006"  # <-- Обновите до последней версии
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux.zip
          unzip sonar-scanner-cli-${SCANNER_VERSION}-linux.zip
          sudo mv sonar-scanner-${SCANNER_VERSION}-linux /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify Installation
        run: |
          echo "Java version:"
          java -version
          echo "SonarScanner version:"
          sonar-scanner -v

      - name: Run Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Принудительно используем системную Java 17
          export SONAR_SCANNER_OPTS="--add-opens=java.base/java.lang=ALL-UNNAMED"
          sonar-scanner \
            -Dsonar.java.version=17 \
            -Dsonar.projectBaseDir=. \
            -Dsonar.organization=adeptsofsloth \
            -Dsonar.projectKey=abominate-sloth_Practic_React \
            -Dsonar.host.url=https://sonarcloud.io \
            -X