name: SonarCloud React Analysis
on:
  push:
    branches: [front_react]
  pull_request:
    branches: [front_react]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          # Убрана настройка cache, так как Maven не используется

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'  # Кэширование только для Node.js

      - name: Install SonarScanner manually
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
          unzip sonar-scanner-cli-*.zip
          sudo mv sonar-scanner-*/ /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          echo "Java version:"
          java -version
          echo "Node version:"
          node -v
          echo "SonarScanner version:"
          sonar-scanner -v

      - name: Run SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export JAVA_HOME=${{ env.JAVA_HOME_17_X64 }}
          export PATH=$JAVA_HOME/bin:$PATH
          sonar-scanner \
            -Dsonar.java.version=17 \
            -Dsonar.projectBaseDir=. \
            -Dsonar.organization=adeptsofsloth \
            -Dsonar.projectKey=abominate-sloth_Practic_React \
            -Dsonar.host.url=https://sonarcloud.io